spring.application.name=formbuilder

server.port=${PORT:8081}

# PostgreSQL via docker-compose (voir docker-compose.yml a la racine du depot).
# En dev : `docker compose up -d db` puis demarrer le backend. Identifiants de dev uniquement.
# stringtype=unspecified : les colonnes jsonb sont ecrites depuis des String (voir JsonColumnConverter).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/formbuilder}?stringtype=unspecified
spring.datasource.username=${DB_USER:formbuilder}
spring.datasource.password=${DB_PASSWORD:formbuilder}

# Schema gere par Flyway (src/main/resources/db/migration) ; Hibernate verifie seulement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
